<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space</title>
    <style>
        :root {
            --bg-color: #0d0b12;
            --card-bg: #161220;
            --accent-pink: #ff758c;
            --accent-glow: rgba(255, 117, 140, 0.4);
            --text-color: #f3f0f7;
            --text-muted: #a39bb3;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px var(--accent-glow);
            box-sizing: border-box;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .user-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent-pink);
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--accent-pink);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9em;
        }
        .nav-btn:hover {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--accent-pink);
            margin-top: 0;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #1e182b;
            border: 1px solid #332947;
            border-radius: 12px;
            color: var(--text-color);
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 12px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .save-btn {
            width: 100%;
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .save-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .note-item {
            background: #1e182b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            border-left: 4px solid var(--accent-pink);
        }
        .note-footer {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- الهيدر مع زر التنقل الأساسي -->
    <div class="header-container">
        <div class="user-badge">
            <div class="user-dot"></div>
            <span id="site-title">Our Secret Space</span>
        </div>
        <button class="nav-btn" id="switchBtn" onclick="switchView()">💬 Chat</button>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="main-card">
        <h2 id="section-title">Welcome Home 🖤</h2>
        
        <div id="view-content">
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">
                هذه هي واجهتكم الرئيسية. تقدرون تختارون الانتقال للتشات أو الملاحظات بكل حرية من الأزرار!
            </p>
            <button class="save-btn" onclick="openNotes()" style="margin-bottom: 10px;">📌 Go to Sweet Notes</button>
            <button class="save-btn" onclick="openChat()" style="background: #332947;">💬 Go to Chat</button>
        </div>
    </div>

    <script>
        function openNotes() {
            document.getElementById('section-title').innerText = 'Sweet Notes 📌';
            document.getElementById('switchBtn').innerText = '🏠 Home';
            document.getElementById('view-content').innerHTML = `
                <textarea id="noteInput" placeholder="Write a new note or thought for us..."></textarea>
                <button class="save-btn" onclick="saveItem()">Save Note 📌</button>
                <div id="itemsContainer">
                    <div class="note-item">
                        <p>Im so grateful for you my love, even tho im not done with this activity but im loving it so far 🫶🫶</p>
                        <div class="note-footer">
                            <span>By: Reef</span>
                            <span>9/25/2026, 3:02:30 AM</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function openChat() {
            document.getElementById('section-title').innerText = 'Real-Time Chat 💬';
            document.getElementById('switchBtn').innerText = '🏠 Home';
            document.getElementById('view-content').innerHTML = `
                <textarea id="noteInput" placeholder="Type a message..."></textarea>
                <button class="save-btn" onclick="saveItem()">Send Message 💬</button>
                <div id="itemsContainer"></div>
            `;
        }

        function switchView() {
            // الزر فوق يرجعك للصفحة الرئيسية الأساسية
            document.getElementById('section-title').innerText = 'Welcome Home 🖤';
            document.getElementById('switchBtn').innerText = '💬 Chat';
            document.getElementById('view-content').innerHTML = `
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">
                    هذه هي واجهتكم الرئيسية. تقدرون تختارون الانتقال للتشات أو الملاحظات بكل حرية من الأزرار!
                </p>
                <button class="save-btn" onclick="openNotes()" style="margin-bottom: 10px;">📌 Go to Sweet Notes</button>
                <button class="save-btn" onclick="openChat()" style="background: #332947;">💬 Go to Chat</button>
            `;
        }

        function saveItem() {
            const text = document.getElementById('noteInput').value;
            if(!text.trim()) return;

            const container = document.getElementById('itemsContainer');
            const dateStr = new Date().toLocaleString();

            const itemDiv = document.createElement('div');
            itemDiv.className = 'note-item';
            itemDiv.innerHTML = `
                <p>${text}</p>
                <div class="note-footer">
                    <span>By: Bat & Reef</span>
                    <span>${dateStr}</span>
                </div>
            `;
            
            container.prepend(itemDiv);
            document.getElementById('noteInput').value = '';
        }
    </script>
</body>
</html>
