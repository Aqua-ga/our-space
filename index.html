<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space</title>
    <style>
        :root {
            --bg-color: #0d0b12;
            --card-bg: #161220;
            --accent-pink: #ff758c;
            --accent-glow: rgba(255, 117, 140, 0.4);
            --text-color: #f3f0f7;
            --text-muted: #a39bb3;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px var(--accent-glow);
            box-sizing: border-box;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .user-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent-pink);
        }
        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--accent-pink);
            margin-top: 0;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #1e182b;
            border: 1px solid #332947;
            border-radius: 12px;
            color: var(--text-color);
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .save-btn {
            width: 100%;
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .save-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .note-item {
            background: #1e182b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            border-left: 4px solid var(--accent-pink);
        }
        .note-footer {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="user-badge">
            <div class="user-dot"></div>
            <span>Reef & Bat</span>
        </div>
    </div>

    <div class="main-card">
        <h2>Sweet Notes 📌</h2>
        
        <textarea id="noteInput" placeholder="Write a new note or thought for us..."></textarea>
        <button class="save-btn" onclick="saveNote()">Save Note 📌</button>

        <div id="notesContainer">
            <div class="note-item">
                <p>Im so grateful for you my love, even tho im not done with this activity but im loving it so far 🫶🫶</p>
                <div class="note-footer">
                    <span>By: Reef</span>
                    <span>9/25/2026, 3:02:30 AM</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function saveNote() {
            const text = document.getElementById('noteInput').value;
            if(!text.trim()) return;

            const container = document.getElementById('notesContainer');
            const dateStr = new Date().toLocaleString();

            const noteDiv = document.createElement('div');
            noteDiv.className = 'note-item';
            noteDiv.innerHTML = `
                <p>${text}</p>
                <div class="note-footer">
                    <span>By: Reef</span>
                    <span>${dateStr}</span>
                </div>
            `;
            
            container.prepend(noteDiv);
            document.getElementById('noteInput').value = '';
        }
    </script>
</body>
</html>
